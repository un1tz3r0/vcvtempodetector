name: Stage 1

on:
  push:
    branches: [main]
  pull_request:

jobs:
  parity:
    name: C++ engine matches the Python reference
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e python
      - run: make -C plugin beattrack
      - run: beatref synth data/synth
      - run: beatref compare data/synth
      - run: beatref --set odf=complex compare data/synth

  plugin:
    name: Build the Rack plugin
    runs-on: ubuntu-24.04
    env:
      RACK_SDK: Rack-SDK-2.6.6-lin-x64
    steps:
      - uses: actions/checkout@v4
      - run: curl -sSfL -o sdk.zip https://vcvrack.com/downloads/$RACK_SDK.zip && unzip -q sdk.zip
      - run: sudo apt-get install -y jq zstd
      - run: make -C plugin -j4 dist RACK_DIR=$PWD/Rack-SDK
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-lin-x64
          path: plugin/dist/*.vcvplugin
